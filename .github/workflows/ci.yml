name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Claude Code ${{ matrix.claude }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The pinned version is the one the README names; latest catches plugin
        # API changes before a release reaches users.
        claude: ["2.1.299", latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${{ matrix.claude }}"

      - name: Validate
        run: claude plugin validate --strict .

      - name: Test
        run: claude plugin test .

      # A -p session does not write a --plugin-dir mod's typings, but loading
      # the bundled plugin-authoring skill writes this build's API
      # declarations under TMPDIR. The dummy key keeps the session from
      # needing a login. The step lays the file out as the engine would, with
      # the engine's compiler options, so the repository's tsconfig.json
      # extends it unchanged.
      - name: Generate typings
        if: runner.os == 'Linux'
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-typings-config"
          export TMPDIR="$RUNNER_TEMP/claude-typings-tmp"
          mkdir -p "$CLAUDE_CONFIG_DIR" "$TMPDIR"
          ANTHROPIC_API_KEY=sk-invalid timeout 120 claude -p /plugin-authoring >/dev/null 2>&1 || true
          version=$(claude --version | cut -d' ' -f1)
          typings=$(find "$TMPDIR" -path "*/bundled-skills/$version/*/plugin-authoring/types/claude-code.d.ts" -print -quit)
          if [ -z "$typings" ]; then
            echo "::error::Claude Code $version did not write the plugin-authoring typings"
            exit 1
          fi
          mkdir -p .claude-plugin/types/claude-code
          cp "$typings" .claude-plugin/types/claude-code/index.d.ts
          cat > .claude-plugin/types/tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "es2023",
              "lib": ["es2023"],
              "module": "esnext",
              "moduleResolution": "bundler",
              "strict": true,
              "noUncheckedIndexedAccess": true,
              "noEmit": true,
              "skipLibCheck": true,
              "jsx": "react",
              "jsxFactory": "h",
              "jsxFragmentFactory": "Fragment",
              "typeRoots": ["."],
              "types": ["claude-code"]
            },
            "include": ["../../hooks", "../../types", "../../tests"]
          }
          EOF

      - name: Type check
        if: runner.os == 'Linux'
        run: npx -y -p typescript@7.0.2 tsc --noEmit -p .
